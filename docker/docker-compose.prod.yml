# Override de produção — usado em conjunto com docker-compose.yml.
#
# Uso:
#   docker compose --env-file .env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.prod.yml \
#     up -d --build
#
# Adiciona um Caddy (HTTPS Let's Encrypt) como ÚNICA superfície pública (80/443)
# e coloca o portal em modo de produção (DEBUG=false, SECURE_SSL=true) sob o
# sub-path {$APP_PATH}. Os serviços internos (postgres/nourau/portal) herdam do
# compose base o bind em 127.0.0.1 (loopback) — NÃO são publicados em 0.0.0.0;
# o Caddy os alcança pela rede interna do Compose. Defesa em profundidade: a
# exposição pública não depende só do firewall de borda.
# (Para remover totalmente o publish no host em runtimes com Compose recente:
#  `ports: !reset []` em cada serviço interno.)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN obrigatório no .env (ex.: 140.238.202.105.sslip.io)}
      APP_PATH: ${APP_PATH:-Biblioteca}
    depends_on:
      - portal
      - nourau

  portal:
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      SECURE_SSL: "true"
      FORCE_SCRIPT_NAME: /${APP_PATH:-Biblioteca}
      ALLOWED_HOSTS: ${DOMAIN},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY obrigatório no .env em produção}

  nourau:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
