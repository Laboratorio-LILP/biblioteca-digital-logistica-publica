[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biblioteca-digital-logistica-publica"
version = "0.1.0"
description = "Biblioteca Digital de Logística Pública do Estado de São Paulo"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg2-binary>=2.9",
    "gunicorn>=22.0",
    "django-environ>=0.11",
    "openpyxl>=3.1",
    "whitenoise>=6.7",
    "django-csp>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-django>=4.9",
]
ai = [
    "openai>=1.50",
    "tenacity>=9.0",
]

# Aplicação Django (executada via Docker / manage.py), não uma biblioteca a empacotar.
# Declara explicitamente que não há pacotes a descobrir, evitando o erro de
# "multiple top-level packages discovered in a flat-layout" e habilitando `pip install -e .`.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portal.settings"
python_files = ["test_*.py"]
